title = "BlueArch AWS Ops Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Known synthetic test fixture values"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = [
  '''BLUE-12345678-1234-1234-1234-123456789012''',
]
paths = [
  '''src/api/tests/(conftest|test_config)\.py''',
]
