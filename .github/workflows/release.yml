name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BINARY_NAME: bluearch-aws-ops
  HOMEBREW_FORMULA: bluearch-aws-ops
  HOMEBREW_TAP_REPO: bluearchio/homebrew-tap
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    if: startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify tag, committed version, and main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE:-}" = "tag" || {
            echo "::error::Releases must run from a tag ref, not a branch"
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must match vX.Y.Z exactly"
            exit 1
          }
          git fetch --no-tags origin \
            dev:refs/remotes/origin/dev \
            main:refs/remotes/origin/main
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          dev_sha="$(git rev-parse origin/dev)"
          main_sha="$(git rev-parse origin/main)"
          test "$tag_sha" = "$head_sha" || {
            echo "::error::Checked-out HEAD must be the release tag commit"
            exit 1
          }
          test "$head_sha" = "$main_sha" || {
            echo "::error::Release tag commit must be exactly origin/main"
            exit 1
          }
          git merge-base --is-ancestor "$dev_sha" "$tag_sha" || {
            echo "::error::origin/dev must be merged into the exact release commit (tag/HEAD/origin/main)"
            exit 1
          }
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          version_text = Path("src/api/aws/misc/version_controller.py").read_text(encoding="utf-8")
          runtime_version = re.search(
              r'^CURRENT_VERSION = os\.environ\.get\("BLUEARCH_AWS_OPS_VERSION", "([^"]+)"\)$',
              version_text,
              re.M,
          ).group(1)
          if project_version != runtime_version or tag != f"v{project_version}":
              raise SystemExit(
                  f"tag/version mismatch: tag={tag} project={project_version} runtime={runtime_version}"
              )
          PY
      - name: Validate release credential availability
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 || secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD GH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required release credential: $name"
              exit 1
            fi
          done

          tap_info="$(gh api "repos/${HOMEBREW_TAP_REPO}" \
            --jq '[.full_name, (.permissions.push // false), (.allow_auto_merge // false)] | @tsv')"
          IFS=$'\t' read -r actual_tap can_push auto_merge <<< "$tap_info"
          if [[ "$actual_tap" != "$HOMEBREW_TAP_REPO" ]]; then
            echo "::error::Homebrew tap token resolved an unexpected repository"
            exit 1
          fi
          if [[ "$can_push" != true ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN_2 requires push access to the Homebrew tap"
            exit 1
          fi
          if [[ "$auto_merge" != true ]]; then
            echo "::error::The Homebrew tap must enable auto-merge"
            exit 1
          fi
          gh pr list --repo "$HOMEBREW_TAP_REPO" --state open --limit 1 >/dev/null

          certificate_file="$(mktemp "${RUNNER_TEMP}/release-certificate.XXXXXX.p12")"
          trap 'rm -f "$certificate_file"' EXIT
          CERTIFICATE_FILE="$certificate_file" python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          encoded = "".join(os.environ["MACOS_CERTIFICATE_P12_BASE64"].split())
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("MACOS_CERTIFICATE_P12_BASE64 is not valid base64")
          if not decoded:
              raise SystemExit("MACOS_CERTIFICATE_P12_BASE64 decodes to an empty value")
          Path(os.environ["CERTIFICATE_FILE"]).write_bytes(decoded)
          PY
          if ! openssl pkcs12 -legacy -in "$certificate_file" \
            -passin env:MACOS_CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::The signing certificate or its password is invalid"
            exit 1
          fi
          rm -f "$certificate_file"
          trap - EXIT

          api_notarization_ready=true
          for name in APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              api_notarization_ready=false
            fi
          done
          apple_id_notarization_ready=true
          for name in APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              apple_id_notarization_ready=false
            fi
          done
          if [[ "$api_notarization_ready" != true && "$apple_id_notarization_ready" != true ]]; then
            echo "::error::Configure a complete notarization credential set"
            exit 1
          fi
          if [[ "$api_notarization_ready" == true ]]; then
            python3 - <<'PY'
          import base64
          import binascii
          import os

          encoded = "".join(os.environ["APPLE_API_KEY_P8_BASE64"].split())
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("APPLE_API_KEY_P8_BASE64 is not valid base64")
          if not decoded:
              raise SystemExit("APPLE_API_KEY_P8_BASE64 decodes to an empty value")
          PY
          fi
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r src/api/requirements.txt -e . pytest pytest-mock httpx2 PyYAML
          npm --prefix frontend ci
      - name: Run repository and release-contract tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src/api python -m pytest src/api/tests -q
          PYTHONPATH=src/api python -m compileall -q src/api
          npm --prefix frontend run build
          bash -n \
            scripts/build_nuitka_linux.sh \
            scripts/build_nuitka_macos.sh \
            scripts/install-linux.sh \
            scripts/verify_linux_artifact.sh \
            scripts/verify_macos_artifact.sh

  linux:
    name: Verified Linux release binary
    needs: verify
    runs-on: ubuntu-22.04
    if: startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r src/api/requirements.txt -e .
          python -m pip install -r build-requirements.txt
      - name: Prepare deterministic bundled templates
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python scripts/prepare_release_templates.py
      - name: Build Linux binary
        run: bash scripts/build_nuitka_linux.sh
      - name: Package and verify final Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C dist -czf "artifacts/$BINARY_NAME-linux-x86_64.tar.gz" "$BINARY_NAME"
          install -m 0755 scripts/install-linux.sh artifacts/install-linux.sh
          bash scripts/verify_linux_artifact.sh \
            "artifacts/$BINARY_NAME-linux-x86_64.tar.gz" \
            "$BINARY_NAME" \
            "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: Verified signed macOS release binary
    needs: verify
    runs-on: macos-14
    if: startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r src/api/requirements.txt -e . pytest pytest-mock PyYAML
          python -m pip install -r build-requirements-macos.txt
      - name: Verify unsigned-artifact rejection contract
        run: PYTHONPATH=src/api python -m pytest src/api/tests/test_release_contract.py -k unsigned -q
      - name: Prepare deterministic bundled templates
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python scripts/prepare_release_templates.py
      - name: Build unsigned macOS binary
        run: bash scripts/build_nuitka_macos.sh
      - name: Import Apple signing assets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 || secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY_SECRET: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          export KEYCHAIN_PATH KEYCHAIN_PASSWORD
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "developer_id.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))
          key_id = os.environ.get("APPLE_API_KEY_ID")
          key = os.environ.get("APPLE_API_KEY_P8_BASE64")
          if key_id and key:
              (temp / f"AuthKey_{key_id}.p8").write_bytes(base64.b64decode(key))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          identity="${MACOS_CODESIGN_IDENTITY_SECRET:-}"
          if [[ -z "$identity" ]]; then
            identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          fi
          [[ -n "$identity" ]] || { echo "::error::Developer ID Application identity not found"; exit 1; }
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "MACOS_CODESIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"
      - name: Sign, notarize, and verify final macOS archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'security delete-keychain "$KEYCHAIN_PATH" || true' EXIT
          [[ -n "${MACOS_CODESIGN_IDENTITY:-}" ]] || { echo "::error::Missing signing identity"; exit 1; }
          mkdir -p artifacts
          codesign --force --timestamp --options runtime --entitlements entitlements.plist --sign "$MACOS_CODESIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "dist/$BINARY_NAME"
          codesign --verify --deep --strict --verbose=2 "dist/$BINARY_NAME"
          (
            cd dist
            ditto -c -k --norsrc --noextattr --noqtn --noacl \
              "$BINARY_NAME" "../artifacts/$BINARY_NAME-macos-arm64.zip"
          )
          if [[ -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER_ID:-}" && -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" ]]; then
            xcrun notarytool submit "artifacts/$BINARY_NAME-macos-arm64.zip" --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_ID_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            xcrun notarytool submit "artifacts/$BINARY_NAME-macos-arm64.zip" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          else
            echo "::error::Missing notarization credentials"
            exit 1
          fi
          bash scripts/verify_macos_artifact.sh \
            "artifacts/$BINARY_NAME-macos-arm64.zip" \
            "$BINARY_NAME" \
            "${RELEASE_TAG#v}"
      - name: Brownfield smoke-test v0.13.7 Nuitka daemon handoff
        shell: bash
        run: |
          set -euo pipefail
          brownfield_dir="$(mktemp -d "$RUNNER_TEMP/bluearch-ops-brownfield.XXXXXX")"
          brownfield_home="$brownfield_dir/home"
          brownfield_tmp="$brownfield_dir/tmp"
          old_prefix="$brownfield_dir/homebrew/Cellar/$BINARY_NAME/0.13.7/bin"
          new_prefix="$brownfield_dir/homebrew/Cellar/$BINARY_NAME/${RELEASE_TAG#v}/bin"
          old_binary="$old_prefix/$BINARY_NAME"
          candidate_binary="$new_prefix/$BINARY_NAME"
          pid_file="$brownfield_home/.bluearch-aws-ops/runtime/web-server.pid"
          old_supervisor_pid=""
          old_listener_pid=""
          new_supervisor_pid=""
          new_listener_pid=""
          fake_core_pid=""

          cleanup() {
            local pid command
            for pid in "$new_listener_pid" "$new_supervisor_pid" "$old_listener_pid" "$old_supervisor_pid"; do
              [[ "$pid" =~ ^[0-9]+$ ]] || continue
              command="$(ps -p "$pid" -o command= 2>/dev/null || true)"
              if [[ "$command" == *"$brownfield_dir"* ]]; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            if [[ "$fake_core_pid" =~ ^[0-9]+$ ]]; then
              if [[ "$(lsof -nP -iTCP:28094 -sTCP:LISTEN -t 2>/dev/null || true)" == "$fake_core_pid" ]]; then
                kill -TERM "$fake_core_pid" 2>/dev/null || true
              fi
            fi
            rm -rf "$brownfield_dir"
          }
          trap cleanup EXIT

          mkdir -p "$brownfield_home" "$brownfield_tmp" "$old_prefix" "$new_prefix"
          old_archive="$brownfield_dir/$BINARY_NAME-v0.13.7.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bluearchio/bluearch-aws-ops/releases/download/v0.13.7/$BINARY_NAME-macos-arm64.zip" \
            --output "$old_archive"
          echo "06821efaa125bbcfb94442188a08936912f8058e2934dffa6cd07b65905434e1  $old_archive" \
            | shasum -a 256 --check
          old_extract="$brownfield_dir/old-asset"
          mkdir -p "$old_extract"
          ditto -x -k "$old_archive" "$old_extract"
          test -x "$old_extract/$BINARY_NAME"
          install -m 0755 "$old_extract/$BINARY_NAME" "$old_binary"
          install -m 0755 "dist/$BINARY_NAME" "$candidate_binary"
          codesign --verify --deep --strict --verbose=2 "$candidate_binary"

          python3 - <<'PY' &
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/api/v1/core/dependency/status"):
                      body = {
                          "app": "bluearch-aws-ops",
                          "core_installed": True,
                          "core_running": True,
                          "compatible": True,
                          "core_version": "0.2.9",
                          "minimum_required_core_version": "0.2.9",
                          "message": "ready",
                      }
                  else:
                      body = {
                          "service": "bluearch-aws-core",
                          "version": "0.2.9",
                          "status": "healthy",
                          "db_ready": True,
                      }
                  payload = json.dumps(body).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, *_args):
                  return

          http.server.ThreadingHTTPServer(("127.0.0.1", 28094), Handler).serve_forever()
          PY
          fake_core_pid="$!"
          for _ in {1..50}; do
            curl --fail --silent --show-error --max-time 1 \
              "http://127.0.0.1:28094/api/v1/core/health" >/dev/null && break
            sleep 0.1
          done
          curl --fail --silent --show-error --max-time 1 \
            "http://127.0.0.1:28094/api/v1/core/health" >/dev/null

          runtime_env=(
            "HOME=$brownfield_home"
            "TMPDIR=$brownfield_tmp"
            "BLUEARCH_CORE_URL=http://127.0.0.1:28094"
            "BLUEARCH_CORE_MANAGED_WEB_START=1"
          )
          env "${runtime_env[@]}" "$old_binary" web start --daemon \
            --host 127.0.0.1 --port 8095 --log-level info --no-browser
          old_supervisor_pid="$(PID_FILE="$pid_file" python3 -c 'import json, os; print(json.load(open(os.environ["PID_FILE"], encoding="utf-8"))["pid"])')"
          old_listener_pid="$(lsof -nP -iTCP:8095 -sTCP:LISTEN -t)"
          [[ "$old_supervisor_pid" =~ ^[0-9]+$ ]]
          [[ "$old_listener_pid" =~ ^[0-9]+$ ]]
          [[ "$old_supervisor_pid" != "$old_listener_pid" ]]
          [[ "$(ps -p "$old_listener_pid" -o ppid= | tr -d '[:space:]')" == "$old_supervisor_pid" ]]
          OLD_LISTENER_PID="$old_listener_pid" EXPECTED_NUITKA_BINARY="$brownfield_home/.bluearch-aws-ops/bin/$BINARY_NAME.bin" \
            python3 -c 'import os, psutil; process = psutil.Process(int(os.environ["OLD_LISTENER_PID"])); assert process.exe() == os.environ["EXPECTED_NUITKA_BINARY"]'

          rm -rf "$brownfield_dir/homebrew/Cellar/$BINARY_NAME/0.13.7"
          env "${runtime_env[@]}" "$candidate_binary" web start --daemon \
            --host 127.0.0.1 --port 8095 --log-level info --no-browser

          for _ in {1..100}; do
            if ! kill -0 "$old_supervisor_pid" 2>/dev/null \
              && ! kill -0 "$old_listener_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$old_supervisor_pid" 2>/dev/null; then
            echo "::error::The v0.13.7 Nuitka supervisor is still running"
            exit 1
          fi
          if kill -0 "$old_listener_pid" 2>/dev/null; then
            echo "::error::The v0.13.7 Nuitka listener is still running"
            exit 1
          fi

          test -s "$pid_file"
          new_listener_pid="$(PID_FILE="$pid_file" python3 -c 'import json, os; print(json.load(open(os.environ["PID_FILE"], encoding="utf-8"))["listener"]["pid"])')"
          new_supervisor_pid="$(PID_FILE="$pid_file" python3 -c 'import json, os; print(json.load(open(os.environ["PID_FILE"], encoding="utf-8"))["supervisor"]["pid"])')"
          [[ "$new_listener_pid" =~ ^[0-9]+$ ]]
          [[ "$new_supervisor_pid" =~ ^[0-9]+$ ]]
          [[ "$new_listener_pid" != "$new_supervisor_pid" ]]
          [[ "$(lsof -nP -iTCP:8095 -sTCP:LISTEN -t)" == "$new_listener_pid" ]]
          PID_FILE="$pid_file" EXPECTED_PID="$new_listener_pid" EXPECTED_SUPERVISOR_PID="$new_supervisor_pid" EXPECTED_LAUNCHER="$candidate_binary" EXPECTED_TEMP_ROOT="$brownfield_tmp" BINARY_NAME="$BINARY_NAME" \
            python3 -c 'import json, os, re; from pathlib import Path; record = json.load(open(os.environ["PID_FILE"], encoding="utf-8")); listener = record["listener"]; supervisor = record["supervisor"]; runtime = Path(listener["executable"]); binary = os.environ["BINARY_NAME"]; supervisor_pid = os.environ["EXPECTED_SUPERVISOR_PID"]; expected_dir = re.compile("^" + re.escape(binary) + "_" + re.escape(supervisor_pid) + "_[0-9]+_[0-9]+$"); assert record["schema"] == 2; assert listener["pid"] == int(os.environ["EXPECTED_PID"]); assert supervisor["pid"] == int(supervisor_pid); assert listener["argv"][0] == os.environ["EXPECTED_LAUNCHER"]; assert runtime.name == binary + ".bin"; assert expected_dir.fullmatch(runtime.parent.name); assert runtime.parent.parent.resolve() == Path(os.environ["EXPECTED_TEMP_ROOT"]).resolve()'
          health="$(curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8095/api/v1/system/health)"
          HEALTH="$health" python3 -c 'import json, os; assert json.loads(os.environ["HEALTH"])["service"] == "bluearch-aws-ops"'

          env "${runtime_env[@]}" "$candidate_binary" web stop
          for _ in {1..100}; do
            if ! kill -0 "$new_supervisor_pid" 2>/dev/null \
              && ! kill -0 "$new_listener_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$new_supervisor_pid" 2>/dev/null; then
            echo "::error::The candidate Nuitka supervisor survived a clean stop"
            exit 1
          fi
          if kill -0 "$new_listener_pid" 2>/dev/null; then
            echo "::error::The candidate Nuitka listener survived a clean stop"
            exit 1
          fi
          if lsof -nP -iTCP:8095 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "::error::The candidate left port 8095 occupied after stop"
            exit 1
          fi
          test ! -e "$pid_file"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  sbom:
    name: Generate release SBOMs
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Extract final release artifacts for SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/sbom-linux-x86_64" \
            "$RUNNER_TEMP/sbom-macos-arm64" \
            sbom-assets
          tar --no-same-owner --no-same-permissions \
            -xzf "release-assets/$BINARY_NAME-linux-x86_64.tar.gz" \
            -C "$RUNNER_TEMP/sbom-linux-x86_64"
          unzip -q "release-assets/$BINARY_NAME-macos-arm64.zip" \
            -d "$RUNNER_TEMP/sbom-macos-arm64"
          test -x "$RUNNER_TEMP/sbom-linux-x86_64/$BINARY_NAME"
          test -f "$RUNNER_TEMP/sbom-macos-arm64/$BINARY_NAME"
      - name: Generate final Linux artifact SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ${{ runner.temp }}/sbom-linux-x86_64
          format: cyclonedx-json
          output-file: sbom-assets/${{ env.BINARY_NAME }}-linux-x86_64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate final macOS artifact SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ${{ runner.temp }}/sbom-macos-arm64
          format: cyclonedx-json
          output-file: sbom-assets/${{ env.BINARY_NAME }}-macos-arm64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-sboms
          path: sbom-assets/*
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [verify, linux, macos, sbom]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    outputs:
      formula_asset: ${{ steps.final_checksums.outputs.formula_asset }}
      formula_sha256: ${{ steps.final_checksums.outputs.formula_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate final checksums
        id: final_checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          checksum_file="$(mktemp "${RUNNER_TEMP}/SHA256SUMS.XXXXXX")"
          trap 'rm -f "${checksum_file}"' EXIT
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > "${checksum_file}"
          mv "${checksum_file}" SHA256SUMS
          trap - EXIT
          sha256sum -c SHA256SUMS
          formula_asset="${BINARY_NAME}-macos-arm64.zip"
          [[ -f "${formula_asset}" ]] || { echo "::error::Missing Homebrew release asset: ${formula_asset}"; exit 1; }
          formula_sha256="$(sha256sum "${formula_asset}" | awk '{print $1}')"
          [[ "${formula_sha256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid Homebrew asset SHA-256"; exit 1; }
          {
            echo "formula_asset=${formula_asset}"
            echo "formula_sha256=${formula_sha256}"
          } >> "${GITHUB_OUTPUT}"
      - name: Generate artifact provenance attestations
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Note skipped artifact attestations
        if: github.event.repository.private
        run: echo "::notice::Artifact attestations are skipped while this repository is private."
      - name: Validate Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing HOMEBREW_TAP_TOKEN_2. Configure a fine-grained token for ${HOMEBREW_TAP_REPO} with Contents and Pull requests read/write access."
            exit 1
          fi
          repo_info="$(gh api "repos/${HOMEBREW_TAP_REPO}" --jq '[.full_name, (.permissions.push // false), (.allow_auto_merge // false)] | @tsv')"
          IFS=$'\t' read -r actual_repo can_push auto_merge <<< "${repo_info}"
          if [[ "${actual_repo}" != "${HOMEBREW_TAP_REPO}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN_2 resolved unexpected repository ${actual_repo}."
            exit 1
          fi
          if [[ "${can_push}" != "true" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN_2 cannot push release branches to ${HOMEBREW_TAP_REPO}."
            exit 1
          fi
          if [[ "${auto_merge}" != "true" ]]; then
            echo "::error::${HOMEBREW_TAP_REPO} must enable auto-merge before product releases are published."
            exit 1
          fi
          gh pr list --repo "${HOMEBREW_TAP_REPO}" --state open --limit 1 >/dev/null
      - name: Publish or resume verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG:-}"
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::RELEASE_TAG must be set by the workflow environment."
            exit 1
          fi
          readonly RELEASE_TAG
          local_assets="${RUNNER_TEMP}/local-release-assets.tsv"
          remote_assets="${RUNNER_TEMP}/remote-release-assets.tsv"
          remote_assets_tmp="${RUNNER_TEMP}/remote-release-assets.tmp"
          : > "${local_assets}"
          while IFS= read -r -d '' asset_path; do
            asset_name="${asset_path#release-assets/}"
            asset_digest="$(sha256sum "${asset_path}" | awk '{print $1}')"
            [[ "${asset_digest}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid local digest for ${asset_name}"; exit 1; }
            printf '%s\tsha256:%s\n' "${asset_name}" "${asset_digest}" >> "${local_assets}"
          done < <(find release-assets -maxdepth 1 -type f -print0)
          LC_ALL=C sort -o "${local_assets}" "${local_assets}"

          verify_remote_assets() {
            local attempt
            for attempt in {1..24}; do
              if gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[] | [.name, (.digest // "")] | @tsv' > "${remote_assets_tmp}"; then
                LC_ALL=C sort "${remote_assets_tmp}" > "${remote_assets}"
                if cmp -s "${local_assets}" "${remote_assets}"; then
                  return 0
                fi
              fi
              echo "::notice::Waiting for exact remote asset digests (attempt ${attempt}/24)."
              sleep 5
            done
            return 1
          }

          release_exists=false
          if release_info="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,tagName --jq '[.databaseId, .tagName, .isDraft] | @tsv' 2>/dev/null)"; then
            release_exists=true
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
            release_info="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,tagName --jq '[.databaseId, .tagName, .isDraft] | @tsv')"
          fi
          IFS=$'\t' read -r release_id release_tag release_is_draft <<< "${release_info}"
          [[ "${release_id}" =~ ^[0-9]+$ ]] || { echo "::error::Unable to resolve release ID"; exit 1; }
          [[ "${release_tag}" == "${RELEASE_TAG}" ]] || { echo "::error::Release tag identity mismatch"; exit 1; }
          [[ "${release_is_draft}" == "true" || "${release_is_draft}" == "false" ]] || { echo "::error::Invalid release draft state"; exit 1; }
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          [[ "${tag_commit}" == "${GITHUB_SHA}" ]] || { echo "::error::Release tag target does not match the workflow commit"; exit 1; }

          if [[ "${release_is_draft}" == "false" ]]; then
            if verify_remote_assets; then
              echo "Existing public release ${RELEASE_TAG} exactly matches the rebuilt verified assets; continuing without mutation."
              exit 0
            fi
            echo "::error::Existing public release does not exactly match the rebuilt verified assets and must never be mutated."
            exit 1
          fi
          if [[ "${release_exists}" == "true" ]]; then
            echo "Resuming existing draft release ${RELEASE_TAG}."
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          if ! verify_remote_assets; then
            echo "::error::Remote release asset names and digests do not exactly match the verified local set."
            echo "Expected assets:"
            sed 's/^/  /' "${local_assets}"
            echo "Remote assets:"
            if [[ -f "${remote_assets}" ]]; then sed 's/^/  /' "${remote_assets}"; fi
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  homebrew:
    name: Promote verified Homebrew formula
    needs: publish
    runs-on: ubuntu-24.04
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    env:
      FORMULA_ASSET: ${{ needs.publish.outputs.formula_asset }}
      FORMULA_SHA256: ${{ needs.publish.outputs.formula_sha256 }}
    steps:
      - name: Validate Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::Missing HOMEBREW_TAP_TOKEN_2"; exit 1; }
          tap_access="$(gh api "repos/${HOMEBREW_TAP_REPO}" --jq '[.full_name, (.permissions.push // false), (.allow_auto_merge // false)] | @tsv')"
          [[ "${tap_access}" == "${HOMEBREW_TAP_REPO}"$'\ttrue\ttrue' ]] || {
            echo "::error::The tap token needs push access and ${HOMEBREW_TAP_REPO} must have auto-merge enabled"
            exit 1
          }
          gh pr list --repo "${HOMEBREW_TAP_REPO}" --state open --limit 1 >/dev/null
      - name: Checkout Homebrew tap main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
          path: homebrew-tap
          fetch-depth: 0
          persist-credentials: false
      - name: Update Homebrew formula from verified asset
        shell: bash
        run: |
          set -euo pipefail
          [[ "${FORMULA_ASSET}" == "${BINARY_NAME}-macos-arm64.zip" ]] || { echo "::error::Unexpected Homebrew asset"; exit 1; }
          [[ "${FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid Homebrew asset SHA-256"; exit 1; }
          cd homebrew-tap
          branch="release/${HOMEBREW_FORMULA}-${RELEASE_TAG}"
          git checkout -B "${branch}" refs/remotes/origin/main
          python3 scripts/update_formula.py \
            --formula "Formula/${HOMEBREW_FORMULA}.rb" \
            --repo "${GITHUB_REPOSITORY}" \
            --version "${RELEASE_TAG}" \
            --asset "${FORMULA_ASSET}" \
            --sha256 "${FORMULA_SHA256}" \
            --binary "${BINARY_NAME}" \
            --legacy-exceptions "config/legacy-dist-exceptions.json"
          ruby -c "Formula/${HOMEBREW_FORMULA}.rb"
      - name: Create or update Homebrew tap pull request
        id: homebrew_pr
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap
          branch="release/${HOMEBREW_FORMULA}-${RELEASE_TAG}"
          [[ "$(git branch --show-current)" == "${branch}" ]] || { echo "::error::Unexpected tap branch"; exit 1; }
          remote_url="$(git remote get-url origin)"
          [[ "${remote_url}" == "https://github.com/${HOMEBREW_TAP_REPO}" || "${remote_url}" == "https://github.com/${HOMEBREW_TAP_REPO}.git" ]] || {
            echo "::error::Unexpected Homebrew tap remote: ${remote_url}"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${HOMEBREW_FORMULA}.rb" "config/legacy-dist-exceptions.json"
          if git diff --cached --quiet; then
            echo "::notice::${HOMEBREW_FORMULA} already points at ${RELEASE_TAG}; no tap pull request is required."
            echo "pr_number=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "chore: update ${HOMEBREW_FORMULA} to ${RELEASE_TAG}"
          gh auth setup-git --hostname github.com
          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"
          if [[ -n "${remote_sha}" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"
          else
            git push --force-with-lease origin "HEAD:refs/heads/${branch}"
          fi
          pr_number="$(gh pr list \
            --repo "${HOMEBREW_TAP_REPO}" \
            --state open \
            --base main \
            --head "${branch}" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create \
              --repo "${HOMEBREW_TAP_REPO}" \
              --base main \
              --head "${branch}" \
              --title "chore: update ${HOMEBREW_FORMULA} to ${RELEASE_TAG}" \
              --body "Updates ${HOMEBREW_FORMULA} to ${RELEASE_TAG} from ${GITHUB_REPOSITORY} using its verified macOS release asset." \
              >/dev/null
            pr_number="$(gh pr list \
              --repo "${HOMEBREW_TAP_REPO}" \
              --state open \
              --base main \
              --head "${branch}" \
              --json number \
              --jq '.[0].number // empty')"
          fi
          [[ "${pr_number}" =~ ^[0-9]+$ ]] || { echo "::error::Unable to create or locate the Homebrew tap pull request"; exit 1; }
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
      - name: Request Homebrew tap auto-merge after required checks
        if: steps.homebrew_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
          PR_NUMBER: ${{ steps.homebrew_pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid Homebrew tap pull request number"; exit 1; }
          gh pr merge "${PR_NUMBER}" --repo "${HOMEBREW_TAP_REPO}" --auto --squash --delete-branch
      - name: Wait for Homebrew formula merge
        if: steps.homebrew_pr.outputs.pr_number != ''
        timeout-minutes: 125
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
          PR_NUMBER: ${{ steps.homebrew_pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid Homebrew tap pull request number"; exit 1; }
          deadline=$((SECONDS + 7200))
          view_failures=0
          while (( SECONDS < deadline )); do
            if state="$(gh pr view "${PR_NUMBER}" --repo "${HOMEBREW_TAP_REPO}" --json state --jq '.state' 2>/dev/null)"; then
              view_failures=0
              case "${state}" in
                MERGED)
                  echo "Homebrew tap pull request #${PR_NUMBER} merged."
                  exit 0
                  ;;
                CLOSED)
                  echo "::error::Homebrew tap pull request #${PR_NUMBER} closed without merging."
                  exit 1
                  ;;
                OPEN)
                  ;;
                *)
                  echo "::warning::Unexpected Homebrew tap pull request state: ${state}"
                  ;;
              esac
            else
              view_failures=$((view_failures + 1))
              echo "::warning::Unable to read Homebrew tap pull request state (attempt ${view_failures}); retrying."
            fi
            sleep 30
          done
          echo "::error::Timed out after 2 hours waiting for Homebrew tap pull request #${PR_NUMBER} to merge."
          exit 1
