name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: bluearch
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  linux:
    name: Linux release binary
    runs-on: ubuntu-22.04
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r src/api/requirements.txt -e .
          python -m pip install -r build-requirements.txt
      - name: Build Linux binary
        run: bash scripts/build_nuitka_linux.sh
      - name: Package Linux asset
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C dist -czf "artifacts/$BINARY_NAME-linux-x86_64.tar.gz" "$BINARY_NAME"
      - name: Generate Linux SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/${{ env.BINARY_NAME }}-linux-x86_64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: Signed macOS release binary
    runs-on: macos-14
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r src/api/requirements.txt -e .
          python -m pip install -r build-requirements-macos.txt
      - name: Build unsigned macOS binary
        run: bash scripts/build_nuitka_macos.sh
      - name: Prepare macOS artifacts directory
        run: mkdir -p artifacts
      - name: Generate macOS SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/${{ env.BINARY_NAME }}-macos-arm64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Import Apple signing assets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "developer_id.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))
          (temp / f"AuthKey_{os.environ['APPLE_API_KEY_ID']}.p8").write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"]))
          PY
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
      - name: Codesign and notarize macOS asset
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          trap 'security delete-keychain "$RUNNER_TEMP/build.keychain" || true' EXIT
          if [[ -z "${MACOS_CODESIGN_IDENTITY:-}" ]]; then
            echo "::error::Missing required signing secret: MACOS_CODESIGN_IDENTITY"
            exit 1
          fi
          codesign --force --timestamp --options runtime --entitlements entitlements.plist --sign "$MACOS_CODESIGN_IDENTITY" "dist/$BINARY_NAME"
          codesign --verify --strict --verbose=2 "dist/$BINARY_NAME"
          mkdir -p artifacts
          ditto -c -k --keepParent "dist/$BINARY_NAME" "artifacts/$BINARY_NAME-macos-arm64.zip"
          xcrun notarytool submit "artifacts/$BINARY_NAME-macos-arm64.zip" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "artifacts/$BINARY_NAME-macos-arm64.zip" || \
            echo "::notice::Notarization succeeded; zip stapling is not required for this CLI artifact."
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish signed release
    runs-on: ubuntu-24.04
    needs: [linux, macos]
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' | \
            sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - name: Publish draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Create a new tag instead of mutating release assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
