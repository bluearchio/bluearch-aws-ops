[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluearch-aws-ops"
version = "0.13.7"
description = "BlueArch AWS Ops CLI and dashboard for recommendations, alerting, and remediation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BlueArch contributors" }]
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
bluearch-aws-ops = "bluearch:run"

[tool.setuptools]
package-dir = {"" = "src/api"}

[tool.setuptools.packages.find]
where = ["src/api"]
include = [
    "aws*",
    "cli*",
    "commons*",
    "database*",
    "db*",
    "modules*",
    "routes*",
    "utils*",
    "web*",
]

[tool.setuptools.dynamic]
dependencies = { file = ["src/api/requirements.txt"] }

# ---------------------------------------------------------------------------
# Black — code formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | dist
  | build
  | __pycache__
  | \.eggs
)/
'''

# ---------------------------------------------------------------------------
# Flake8 — linting (via flake8 config, not natively in pyproject.toml)
# ---------------------------------------------------------------------------
# Flake8 doesn't support pyproject.toml natively. Use .flake8 file instead.

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    "dist",
    "build",
    "tests",
    "__pycache__",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["src/api/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
